name: Truth News CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Truth App

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

                - name: Test
            run: |
              if [ -d "test" ]; then
                flutter test
              else
                echo "No test directory found; skipping Flutter tests."
              fi

  backend:
    name: Backend syntax check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Truth App/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Truth App/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.mjs